
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Household Products | CLEAN WAVE</title>

    <link rel="stylesheet" href="style.css">

    <script src="/auth.js" defer></script>
    <script src="app.js" defer></script>
</head>

<body>

<header class="header">
    <div class="nav-container">

        <!-- Website Logo -->
        <a href="index.html" class="logo">
            CLEAN <span>WAVE</span>
        </a>

        <!-- Mobile Cart Icon - Outside Hamburger Menu -->
        <a href="cart.html"
           class="cart-mobile-shortcut"
           aria-label="Shopping Cart">

            <svg viewBox="0 0 24 24"
                 width="23"
                 height="23"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>

                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>

            <span id="cartCountMobile" class="cart-mobile-count">0</span>
        </a>

        <!-- Hamburger Menu -->
        <button class="menu-toggle"
                id="menuToggle"
                aria-label="Toggle menu"
                aria-expanded="false">

            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Navigation -->
        <nav class="navbar" id="navbar">

            <a href="index.html">Home</a>

            <a href="index.html#about">About</a>

            <a href="index.html#contact">Contact</a>

            <a href="cart.html" class="cart-btn">
                Cart <span id="cartCount">0</span>
            </a>

            <a href="tel:+919106562058" class="call-btn">
                Call Us
            </a>

        </nav>

    </div>
</header>

<main class="category-page">

    <div class="page-heading">
        <span>OUR PRODUCT RANGE</span>
        <h1>Household Products</h1>
        <p>Cleaning products for everyday household use.</p>
    </div>

    <!-- Household Products -->
    <div class="product-grid"
         id="productGrid"
         data-category="household">
    </div>

    <div class="back-home">
        <a href="index.html">← Back to Home</a>
    </div>

</main>

<footer class="footer">

    <a href="index.html" class="logo footer-logo">
        CLEAN <span>WAVE</span>
    </a>

    <p>Quality cleaning solutions from CLEAN WAVE.</p>

    <p class="copyright">
        © 2026 CLEAN WAVE. All Rights Reserved.
    </p>

</footer>

<!-- Synchronize Mobile Cart Quantity -->
<script>
document.addEventListener("DOMContentLoaded", function () {

    const desktopCount = document.getElementById("cartCount");
    const mobileCount = document.getElementById("cartCountMobile");

    if (!desktopCount || !mobileCount) {
        return;
    }

    function updateMobileCartCount() {
        mobileCount.textContent = desktopCount.textContent.trim();
    }

    updateMobileCartCount();

    const observer = new MutationObserver(updateMobileCartCount);

    observer.observe(desktopCount, {
        childList: true,
        characterData: true,
        subtree: true
    });

});
</script>

</body>
</html>
